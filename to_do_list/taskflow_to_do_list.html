<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern, fully responsive To-Do List web application featuring CRUD operations, local storage persistence, filtering, and theme toggling.">
    <title>TaskFlow | Modern To-Do List</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Palette - Light Theme */
            --primary-rgb: 99, 102, 241;
            --primary: rgb(var(--primary-rgb));
            --primary-hover: #4f46e5;
            --primary-light: rgba(var(--primary-rgb), 0.1);
            
            --success: #10b981;
            --success-light: rgba(16, 185, 129, 0.12);
            --danger: #ef4444;
            --danger-light: rgba(239, 68, 68, 0.1);
            --warning: #f59e0b;

            --bg-main: #f4f6fb;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --border-focus: var(--primary);

            /* Shadows & Effects */
            --shadow-sm: 0 2px 4px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
            --shadow-lg: 0 20px 35px -10px rgba(99, 102, 241, 0.12), 0 10px 15px -5px rgba(15, 23, 42, 0.04);
            --shadow-inner: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);

            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;

            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);

            --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        [data-theme="dark"] {
            --bg-main: #0b0f19;
            --bg-card: #151c2c;
            --bg-input: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #243048;

            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 35px -10px rgba(99, 102, 241, 0.2);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: clamp(1rem, 3vw, 2.5rem) clamp(0.75rem, 3vw, 1.5rem);
            transition: background-color var(--transition-normal), color var(--transition-normal);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        :focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 3px;
        }

        button, input, select {
            font-family: inherit;
            font-size: inherit;
        }

        button {
            cursor: pointer;
            border: none;
            background: none;
        }

        .app-container {
            width: 100%;
            max-width: min(680px, 100%);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.25rem;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: clamp(1.25rem, 2.5vw, 1.5rem);
            font-weight: 800;
            letter-spacing: -0.03em;
        }

        .logo-icon {
            width: 2.25rem;
            height: 2.25rem;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary) 0%, #818cf8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(var(--primary-rgb), 0.35);
        }

        .logo-icon svg {
            width: 1.35rem;
            height: 1.35rem;
            stroke-width: 2.5;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .theme-toggle {
            width: 2.5rem;
            height: 2.5rem;
            border-radius: var(--radius-full);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-bounce);
        }

        .theme-toggle:hover {
            transform: scale(1.08) rotate(10deg);
            border-color: var(--primary);
        }

        .theme-toggle svg {
            width: 1.2rem;
            height: 1.2rem;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .hero-banner {
            text-align: center;
            padding: 1rem 0 0.5rem;
        }

        .main-title {
            font-size: clamp(1.85rem, 5vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.15;
            background: linear-gradient(135deg, var(--text-main) 30%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.35rem;
        }

        .subtitle {
            font-size: clamp(0.875rem, 2vw, 1rem);
            color: var(--text-muted);
            font-weight: 500;
        }

        .main-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-lg);
            padding: clamp(1.25rem, 3.5vw, 2rem);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            transition: background-color var(--transition-normal), border-color var(--transition-normal);
        }

        .input-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .task-input {
            width: 100%;
            padding: 1rem 3.5rem 1rem 1.25rem;
            border-radius: var(--radius-md);
            border: 2px solid var(--border-color);
            background-color: var(--bg-input);
            color: var(--text-main);
            font-size: clamp(0.95rem, 2vw, 1.05rem);
            transition: all var(--transition-normal);
            box-shadow: var(--shadow-inner);
        }

        .task-input:focus {
            border-color: var(--primary);
            background-color: var(--bg-card);
            box-shadow: 0 0 0 4px var(--primary-light);
            outline: none;
        }

        .task-input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        .add-btn {
            position: absolute;
            right: 0.5rem;
            width: 2.75rem;
            height: 2.75rem;
            border-radius: var(--radius-sm);
            background: var(--primary);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-bounce);
            box-shadow: 0 4px 10px rgba(var(--primary-rgb), 0.3);
        }

        .add-btn:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .add-btn:active {
            transform: scale(0.95);
        }

        .add-btn svg {
            width: 1.35rem;
            height: 1.35rem;
            stroke: currentColor;
            stroke-width: 2.5;
        }

        .input-error {
            color: var(--danger);
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 0.35rem;
            animation: shake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        }

        .input-error.visible {
            display: flex;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .task-counter {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .counter-badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 0.15rem 0.65rem;
            border-radius: var(--radius-full);
            font-size: 0.825rem;
            font-weight: 800;
            font-family: var(--font-mono);
        }

        .filters-group {
            display: flex;
            align-items: center;
            background: var(--bg-input);
            padding: 0.25rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            gap: 0.2rem;
        }

        .filter-btn {
            padding: 0.4rem 0.85rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
        }

        .filter-btn:hover {
            color: var(--text-main);
        }

        .filter-btn.active {
            background: var(--bg-card);
            color: var(--primary);
            font-weight: 700;
            box-shadow: var(--shadow-sm);
        }

        .clear-btn {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            padding: 0.4rem 0.75rem;
            border-radius: var(--radius-sm);
            transition: all var(--transition-fast);
        }

        .clear-btn:hover {
            color: var(--danger);
            background: var(--danger-light);
        }

        .task-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-height: 120px;
        }

        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 0.9rem 1.1rem;
            border-radius: var(--radius-md);
            gap: 0.85rem;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast), opacity 0.25s ease;
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .task-item:hover {
            border-color: rgba(var(--primary-rgb), 0.4);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .task-item.completed {
            background-color: rgba(var(--primary-rgb), 0.02);
            border-color: var(--border-color);
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            flex: 1;
            min-width: 0;
        }

        /* Custom Checkbox */
        .checkbox-container {
            position: relative;
            width: 1.4rem;
            height: 1.4rem;
            flex-shrink: 0;
            cursor: pointer;
        }

        .checkbox-container input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            height: 1.4rem;
            width: 1.4rem;
            border-radius: 6px;
            border: 2px solid var(--text-muted);
            background-color: transparent;
            transition: all var(--transition-bounce);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox-container:hover input ~ .checkmark {
            border-color: var(--primary);
        }

        .checkbox-container input:checked ~ .checkmark {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .checkmark svg {
            width: 0.9rem;
            height: 0.9rem;
            stroke: #ffffff;
            stroke-width: 3;
            stroke-dasharray: 20;
            stroke-dashoffset: 20;
            transition: stroke-dashoffset 0.25s ease-in-out;
            fill: none;
        }

        .checkbox-container input:checked ~ .checkmark svg {
            stroke-dashoffset: 0;
        }

        .task-text {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
            word-break: break-word;
            transition: color var(--transition-fast), text-decoration var(--transition-fast);
            line-height: 1.4;
        }

        .task-item.completed .task-text {
            color: var(--text-muted);
            text-decoration: line-through;
            opacity: 0.75;
        }

        /* Inline Edit Input */
        .edit-input {
            width: 100%;
            padding: 0.4rem 0.65rem;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
            background: var(--bg-input);
            border: 1.5px solid var(--primary);
            border-radius: var(--radius-sm);
            outline: none;
        }

        /* Action Buttons */
        .task-actions {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            flex-shrink: 0;
        }

        .action-btn {
            width: 2.1rem;
            height: 2.1rem;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: all var(--transition-fast);
        }

        .action-btn svg {
            width: 1.1rem;
            height: 1.1rem;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        .edit-btn:hover {
            color: var(--primary);
            background: var(--primary-light);
        }

        .delete-btn:hover {
            color: var(--danger);
            background: var(--danger-light);
        }

        .save-btn {
            color: var(--success);
            background: var(--success-light);
        }

        .save-btn:hover {
            background: rgba(16, 185, 129, 0.2);
        }

        /* Animations for Add/Remove */
        .task-item.adding {
            animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .task-item.deleting {
            animation: slideOut 0.3s ease-in forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-15px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes slideOut {
            from {
                opacity: 1;
                transform: translateX(0);
                max-height: 80px;
            }
            to {
                opacity: 0;
                transform: translateX(50px);
                max-height: 0;
                padding-top: 0;
                padding-bottom: 0;
                margin-top: 0;
                margin-bottom: 0;
                border: none;
            }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            text-align: center;
            color: var(--text-muted);
            gap: 1rem;
        }

        .empty-illustration {
            width: 4.5rem;
            height: 4.5rem;
            border-radius: 50%;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
        }

        .empty-illustration svg {
            width: 2.25rem;
            height: 2.25rem;
            stroke-width: 1.5;
        }

        .empty-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .empty-subtitle {
            font-size: 0.9rem;
            max-width: 280px;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 1.75rem;
            left: 50%;
            transform: translateX(-50%) translateY(120%);
            background: var(--text-main);
            color: var(--bg-main);
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-full);
            font-size: 0.875rem;
            font-weight: 600;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 1000;
            transition: transform var(--transition-bounce);
            pointer-events: none;
        }

        .toast.visible {
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 580px) {
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .filters-group {
                justify-content: center;
                order: 3;
                width: 100%;
            }

            .task-counter {
                order: 1;
            }

            .clear-btn {
                order: 2;
                align-self: flex-end;
                margin-top: -2rem;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Top Navigation Header -->
        <header class="header">
            <div class="brand-logo">
                <div class="logo-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                </div>
                <span>TaskFlow</span>
            </div>
            
            <div class="header-actions">
                <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode" title="Switch Theme">
                    <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
            </div>
        </header>

        <!-- Main Title Banner -->
        <section class="hero-banner">
            <h1 class="main-title">MY TO-DO LIST</h1>
            <p class="subtitle">Organize your day easily & boost your productivity</p>
        </section>

        <!-- Main App Card Panel -->
        <main class="main-card">
            <!-- Add Task Form -->
            <form class="input-form" id="task-form" novalidate>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="task-input" 
                        class="task-input" 
                        placeholder="What needs to be done?" 
                        aria-label="New task input"
                        autocomplete="off"
                        maxlength="120"
                    >
                    <button type="submit" class="add-btn" id="add-btn" aria-label="Add task" title="Add Task">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                </div>
                <div class="input-error" id="input-error" role="alert">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <span>Please enter a task before adding!</span>
                </div>
            </form>

            <!-- Controls and Filters -->
            <div class="controls-bar">
                <div class="task-counter" id="task-counter">
                    <span class="counter-badge" id="counter-badge">0</span>
                    <span id="counter-text">tasks remaining</span>
                </div>

                <div class="filters-group" role="tablist" aria-label="Task filters">
                    <button type="button" class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
                    <button type="button" class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
                    <button type="button" class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
                </div>

                <button type="button" class="clear-btn" id="clear-completed-btn">Clear Completed</button>
            </div>

            <!-- Dynamic Task List -->
            <ul class="task-list" id="task-list" aria-live="polite" role="list">
                <!-- Tasks will be dynamically rendered here via JS -->
            </ul>

            <!-- Empty State Container -->
            <div class="empty-state" id="empty-state" style="display: none;">
                <div class="empty-illustration">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                </div>
                <h2 class="empty-title" id="empty-title">All clear!</h2>
                <p class="empty-subtitle" id="empty-subtitle">You have no tasks right now. Add one above to get started!</p>
            </div>
        </main>
    </div>

    <!-- Feedback Toast -->
    <div class="toast" id="toast" role="status">
        <span id="toast-text">Task updated!</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            /* ==========================================================================
               APPLICATION STATE
               ========================================================================== */
            const STORAGE_KEY = 'taskflow_tasks_v2';
            const THEME_KEY = 'taskflow_theme_v2';

            let tasks = [];
            let currentFilter = 'all'; // 'all' | 'active' | 'completed'

            /* ==========================================================================
               DOM ELEMENTS
               ========================================================================== */
            const taskForm = document.getElementById('task-form');
            const taskInput = document.getElementById('task-input');
            const inputError = document.getElementById('input-error');
            const taskList = document.getElementById('task-list');
            const emptyState = document.getElementById('empty-state');
            const emptyTitle = document.getElementById('empty-title');
            const emptySubtitle = document.getElementById('empty-subtitle');
            const counterBadge = document.getElementById('counter-badge');
            const counterText = document.getElementById('counter-text');
            const filterBtns = document.querySelectorAll('.filter-btn');
            const clearCompletedBtn = document.getElementById('clear-completed-btn');
            const themeToggleBtn = document.getElementById('theme-toggle');
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');

            /**
             * Load initial state from LocalStorage
             */
            function init() {
                loadTheme();
                loadTasks();
                renderTasks();
                setupEventListeners();
            }

            /**
             * Save tasks array to LocalStorage
             */
            function saveTasks() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
                } catch (e) {
                    console.error('Failed to save tasks to LocalStorage:', e);
                }
            }

            /**
             * Fetch tasks array from LocalStorage
             */
            function loadTasks() {
                try {
                    const saved = localStorage.getItem(STORAGE_KEY);
                    tasks = saved ? JSON.parse(saved) : [
                        { id: Date.now() - 2000, text: "Complete Java Assignment", completed: false },
                        { id: Date.now() - 1000, text: "Submit Project Report", completed: true },
                        { id: Date.now(), text: "Study JavaScript DOM & Events", completed: false }
                    ];
                } catch (e) {
                    console.error('Failed to load tasks:', e);
                    tasks = [];
                }
            }

            /**
             * Add a new task to state
             */
            function addTask(text) {
                const trimmedText = text.trim();
                if (!trimmedText) {
                    showError();
                    return;
                }

                hideError();

                const newTask = {
                    id: Date.now(),
                    text: trimmedText,
                    completed: false
                };

                tasks.unshift(newTask);
                saveTasks();
                
                // Render and mark newly added item with animation class
                renderTasks(newTask.id);
                taskInput.value = '';
                taskInput.focus();
                showToast('Task added successfully!');
            }

            /**
             * Toggle completed state of a task
             */
            function toggleTask(id) {
                tasks = tasks.map(task => {
                    if (task.id === id) {
                        return { ...task, completed: !task.completed };
                    }
                    return task;
                });

                saveTasks();
                renderTasks();
            }

            /**
             * Delete a task by ID
             */
            function deleteTask(id) {
                const taskElement = document.querySelector(`[data-id="${id}"]`);
                if (taskElement) {
                    taskElement.classList.add('deleting');
                    taskElement.addEventListener('animationend', () => {
                        tasks = tasks.filter(task => task.id !== id);
                        saveTasks();
                        renderTasks();
                        showToast('Task deleted');
                    }, { once: true });
                } else {
                    tasks = tasks.filter(task => task.id !== id);
                    saveTasks();
                    renderTasks();
                }
            }

            /**
             * Edit task text inline
             */
            function startEditing(id) {
                const taskElement = document.querySelector(`[data-id="${id}"]`);
                if (!taskElement) return;

                const task = tasks.find(t => t.id === id);
                if (!task) return;

                const textSpan = taskElement.querySelector('.task-text');
                const actionsContainer = taskElement.querySelector('.task-actions');

                // Replace text span with an input field
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'edit-input';
                input.value = task.text;
                input.maxLength = 120;

                textSpan.replaceWith(input);
                input.focus();
                input.select();

                // Swap edit button with save button
                actionsContainer.innerHTML = `
                    <button type="button" class="action-btn save-btn" data-action="save" aria-label="Save task">
                        <svg viewBox="0 0 24 24" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>
                    </button>
                `;

                function handleSave() {
                    const newText = input.value.trim();
                    if (newText) {
                        tasks = tasks.map(t => t.id === id ? { ...t, text: newText } : t);
                        saveTasks();
                        showToast('Task updated');
                    }
                    renderTasks();
                }

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        handleSave();
                    } else if (e.key === 'Escape') {
                        renderTasks();
                    }
                });

                const saveBtn = actionsContainer.querySelector('[data-action="save"]');
                saveBtn.addEventListener('click', handleSave);
            }

            /**
             * Clear all completed tasks
             */
            function clearCompleted() {
                const completedCount = tasks.filter(t => t.completed).length;
                if (completedCount === 0) {
                    showToast('No completed tasks to clear');
                    return;
                }

                tasks = tasks.filter(t => !t.completed);
                saveTasks();
                renderTasks();
                showToast(`Cleared ${completedCount} completed task(s)`);
            }

            /**
             * Render tasks based on filter state
             */
            function renderTasks(newTaskId = null) {
                const filteredTasks = tasks.filter(task => {
                    if (currentFilter === 'active') return !task.completed;
                    if (currentFilter === 'completed') return task.completed;
                    return true; // 'all'
                });

                taskList.innerHTML = '';

                if (filteredTasks.length === 0) {
                    taskList.style.display = 'none';
                    emptyState.style.display = 'flex';
                    updateEmptyStateMessage();
                } else {
                    taskList.style.display = 'flex';
                    emptyState.style.display = 'none';

                    filteredTasks.forEach(task => {
                        const li = document.createElement('li');
                        li.className = `task-item ${task.completed ? 'completed' : ''} ${task.id === newTaskId ? 'adding' : ''}`;
                        li.setAttribute('data-id', task.id);

                        li.innerHTML = `
                            <div class="task-left">
                                <label class="checkbox-container">
                                    <input type="checkbox" ${task.completed ? 'checked' : ''} data-action="toggle" aria-label="Mark task completed">
                                    <span class="checkmark">
                                        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                                    </span>
                                </label>
                                <span class="task-text">${escapeHTML(task.text)}</span>
                            </div>
                            <div class="task-actions">
                                <button type="button" class="action-btn edit-btn" data-action="edit" aria-label="Edit task" title="Edit Task">
                                    <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                </button>
                                <button type="button" class="action-btn delete-btn" data-action="delete" aria-label="Delete task" title="Delete Task">
                                    <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                                </button>
                            </div>
                        `;

                        taskList.appendChild(li);
                    });
                }

                updateCounter();
            }

            /**
             * Update task counter badge and label text
             */
            function updateCounter() {
                const remainingCount = tasks.filter(t => !t.completed).length;
                counterBadge.textContent = remainingCount;
                counterText.textContent = remainingCount === 1 ? 'task remaining' : 'tasks remaining';
            }

            /**
             * Dynamic text for empty state depending on filter
             */
            function updateEmptyStateMessage() {
                if (tasks.length === 0) {
                    emptyTitle.textContent = 'All clear!';
                    emptySubtitle.textContent = 'You have no tasks right now. Add one above to get started!';
                } else if (currentFilter === 'active') {
                    emptyTitle.textContent = 'No active tasks!';
                    emptySubtitle.textContent = 'Great job! You have completed all your tasks.';
                } else if (currentFilter === 'completed') {
                    emptyTitle.textContent = 'No completed tasks yet';
                    emptySubtitle.textContent = 'Finish a task to see it listed here!';
                }
            }

            /**
             * Main Event Listeners
             */
            function setupEventListeners() {
                // Form submission
                taskForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    addTask(taskInput.value);
                });

                // Clear input error on typing
                taskInput.addEventListener('input', () => {
                    if (taskInput.value.trim()) {
                        hideError();
                    }
                });

                // EVENT DELEGATION on Task List Container
                taskList.addEventListener('click', (e) => {
                    const target = e.target;
                    const actionBtn = target.closest('[data-action]');
                    if (!actionBtn) return;

                    const action = actionBtn.getAttribute('data-action');
                    const taskItem = target.closest('.task-item');
                    if (!taskItem) return;

                    const id = Number(taskItem.getAttribute('data-id'));

                    if (action === 'toggle') {
                        toggleTask(id);
                    } else if (action === 'delete') {
                        deleteTask(id);
                    } else if (action === 'edit') {
                        startEditing(id);
                    }
                });

                // Filter Buttons
                filterBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        filterBtns.forEach(b => {
                            b.classList.remove('active');
                            b.setAttribute('aria-selected', 'false');
                        });

                        btn.classList.add('active');
                        btn.setAttribute('aria-selected', 'true');

                        currentFilter = btn.getAttribute('data-filter');
                        renderTasks();
                    });
                });

                // Clear Completed
                clearCompletedBtn.addEventListener('click', clearCompleted);

                // Dark / Light Theme Toggle
                themeToggleBtn.addEventListener('click', toggleTheme);
            }

            /**
             * Toggle Dark / Light Mode
             */
            function toggleTheme() {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem(THEME_KEY, newTheme);
                showToast(`Switched to ${newTheme} mode`);
            }

            function loadTheme() {
                const savedTheme = localStorage.getItem(THEME_KEY);
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            }

            function showError() {
                inputError.classList.add('visible');
                taskInput.focus();
            }

            function hideError() {
                inputError.classList.remove('visible');
            }

            let toastTimeout;
            function showToast(message) {
                toastText.textContent = message;
                toast.classList.add('visible');
                clearTimeout(toastTimeout);
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('visible');
                }, 2500);
            }

            function escapeHTML(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        "'": '&#39;',
                        '"': '&quot;'
                    }[tag] || tag)
                );
            }

            // Launch Application
            init();
        });
    </script>
</body>
</html>
